<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rubbel-like AI Assistant — Demo Local</title>
  <style>
    body { font-family: system-ui, Arial; max-width:900px; margin:20px auto; }
    #avatar { width:300px; height:300px; margin:0 auto; }
    .controls { display:flex; gap:8px; margin:12px 0; align-items:center; }
    button { padding:10px 16px; }
    #status { margin-top:8px; font-weight:600; }
    #transcript { width:100%; height:80px; }
    #deviceState { margin-top:8px; background:#f1f1f1; padding:8px; }
  </style>
</head>
<body>
  <h2>Rubbel-like AI Assistant — Demo Local</h2>
  <div id="avatar"></div>
  <div id="status">Status: idle</div>

  <div class="controls">
    <button id="btnListen">Mulai Bicara</button>
    <button id="btnStop">Stop</button>
    <button id="btnSendText">Kirim Teks</button>
    <input id="textInput" placeholder="Ketik atau suara akan muncul di sini" style="flex:1" />
  </div>

  <textarea id="transcript" placeholder="Transkrip akan muncul di sini..."></textarea>

  <div id="deviceState">
    <strong>Simulasi perangkat:</strong>
    <div id="tvState">TV: off</div>
    <div id="acState">AC: off</div>
    <div id="lampState">Lampu: off</div>
  </div>

  <div style="margin-top:12px">
    <strong>Log:</strong>
    <pre id="log" style="height:150px; overflow:auto; background:#f8f8f8; padding:8px"></pre>
  </div>

  <!-- Dependencies: Lottie -->
  <script src="https://unpkg.com/lottie-web/build/player/lottie.min.js"></script>

  <script>
  const BACKEND_CHAT_ENDPOINT = 'http://localhost:3000/api/chat';

  // ===== Avatar (Lottie) setup =====
  const avatarContainer = document.getElementById('avatar');
  const LOTTIE_IDLE = 'https://assets4.lottiefiles.com/packages/lf20_touohxv0.json';
  const LOTTIE_LISTENING = 'https://assets2.lottiefiles.com/packages/lf20_j1adxtyb.json';
  const LOTTIE_THINKING = 'https://assets7.lottiefiles.com/packages/lf20_kyu7xb1v.json';
  const LOTTIE_SPEAKING = 'https://assets3.lottiefiles.com/packages/lf20_8f0v1v.json';

  let currentAnim = null;
  function loadLottie(url, loop=true) {
    if (currentAnim) { currentAnim.destroy(); currentAnim = null; }
    currentAnim = lottie.loadAnimation({
      container: avatarContainer,
      renderer: 'svg',
      loop: loop,
      autoplay: true,
      path: url
    });
  }
  function setAvatar(state) {
    document.getElementById('status').innerText = 'Status: ' + state;
    switch(state) {
      case 'listening': loadLottie(LOTTIE_LISTENING, true); break;
      case 'thinking': loadLottie(LOTTIE_THINKING, true); break;
      case 'speaking': loadLottie(LOTTIE_SPEAKING, true); break;
      default: loadLottie(LOTTIE_IDLE, true); break;
    }
  }
  setAvatar('idle');

  const logEl = document.getElementById('log');
  function log(msg) { console.log(msg); logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; }

  // ===== SpeechRecognition (Web Speech API) =====
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('SpeechRecognition API tidak tersedia di browser ini. Gunakan Chrome/Edge di HTTPS atau localhost.');
  }
  const recognition = SpeechRecognition ? new SpeechRecognition() : null;
  if (recognition) {
    recognition.lang = 'id-ID';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { setAvatar('listening'); log('[ASR] started listening'); }
    recognition.onresult = (ev) => {
      const text = ev.results[0][0].transcript;
      document.getElementById('textInput').value = text;
      document.getElementById('transcript').value += 'User: ' + text + "\n";
      log('[ASR] result: ' + text);
      sendToBackend(text);
    };
    recognition.onerror = (e) => { log('[ASR] error: ' + e.error); setAvatar('idle'); }
    recognition.onend = () => { log('[ASR] ended'); }
  }

  // Controls
  document.getElementById('btnListen').addEventListener('click', ()=> {
    if (!recognition) return;
    try { recognition.start(); } catch(err) { log('[ASR] start error: ' + err); }
  });
  document.getElementById('btnStop').addEventListener('click', ()=> {
    if (recognition) recognition.stop();
    setAvatar('idle');
  });
  document.getElementById('btnSendText').addEventListener('click', ()=> {
    const txt = document.getElementById('textInput').value.trim();
    if (txt) sendToBackend(txt);
  });

  // ===== Send recognized text to backend =====
  async function sendToBackend(text) {
    setAvatar('thinking');
    log('[APP] sending to backend: ' + text);
    try {
      const resp = await fetch(BACKEND_CHAT_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message: text})
      });
      if (!resp.ok) {
        const t = await resp.text();
        log('[APP] backend error: ' + resp.status + ' ' + t);
        setAvatar('idle');
        return;
      }
      const data = await resp.json();
      const reply = data.reply || 'Maaf, saya tidak mengerti.';
      document.getElementById('transcript').value += 'Assistant: ' + reply + "\n";
      log('[APP] backend reply: ' + reply);

      if (data.device_action) {
        log('[APP] device action detected: ' + JSON.stringify(data.device_action));
        simulateDeviceAction(data.device_action);
      }

      await speakText(reply);
    } catch (err) {
      log('[APP] send error: ' + err);
      setAvatar('idle');
    }
  }

  // ===== simulate device action (no MQTT/hardware) =====
  function simulateDeviceAction(act) {
    // act: {device:"tv", action:"off"} or {device:"ac", action:"set","value":22}
    if (!act || !act.device) return;
    const dev = act.device.toLowerCase();
    if (dev === 'tv') {
      if (act.action === 'on') document.getElementById('tvState').innerText = 'TV: on';
      else if (act.action === 'off') document.getElementById('tvState').innerText = 'TV: off';
    } else if (dev === 'lamp' || dev === 'lampu') {
      if (act.action === 'on') document.getElementById('lampState').innerText = 'Lampu: on';
      else if (act.action === 'off') document.getElementById('lampState').innerText = 'Lampu: off';
    } else if (dev === 'ac') {
      if (act.action === 'on') document.getElementById('acState').innerText = 'AC: on';
      else if (act.action === 'off') document.getElementById('acState').innerText = 'AC: off';
      else if (act.action === 'set' && act.value) document.getElementById('acState').innerText = 'AC: ' + act.value + '°C';
    }
  }

  // ===== SpeechSynthesis for audio response =====
  function speakText(text) {
    return new Promise((resolve, reject) => {
      if (!('speechSynthesis' in window)) {
        log('[TTS] SpeechSynthesis not supported');
        setAvatar('idle');
        return resolve();
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.onstart = () => { setAvatar('speaking'); log('[TTS] started speaking'); };
      utter.onend = () => { setAvatar('idle'); log('[TTS] finished speaking'); resolve(); };
      utter.onerror = (e) => { setAvatar('idle'); log('[TTS] error: ' + e); resolve(); };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    });
  }
  </script>
</body>
</html>
